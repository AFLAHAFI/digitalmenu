<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>Digital Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.svg">
</head>
<body>
  <div class="hub" id="hub"></div>
  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
  // Staff start page. Waiter / kitchen / cashier go straight to their screen;
  // owner and manager see every screen.
  (async function () {
    const { t, esc } = DM;
    const { r, me } = await DM.requireStaff(null);
    DM.demoBanner();
    if (!DM.param('stay') && ['waiter', 'kitchen', 'cashier'].includes(me.role)) {
      location.replace(DM.link(DM.homeFor(me.role), r)); return;
    }
    const SUB = {
      waiter: 'Opens the QR for a table · takes orders', kitchen: 'Big table numbers, beep, stock on/off',
      counter: 'Bills per table, mark paid, today\'s total', reports: 'Sales, busy hours, top dishes, Excel',
      admin: 'Menu & photos, staff logins, look, activity',
    };
    function render() {
      const name = DM.lang === 'ml' && r.name_ml ? r.name_ml : r.name;
      $hub.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span class="muted">${t('app')}</span>
          <span style="display:flex;gap:6px">${DM.langToggleHTML()}<button class="lang-btn" data-theme-toggle>${DM.themeIcon()}</button></span></div>
        ${r.logo_url ? `<img src="${esc(r.logo_url)}" alt="" style="width:64px;height:64px;border-radius:16px;margin-top:12px;object-fit:cover">` : ''}
        <h1>${esc(name)}</h1>
        <p class="muted" style="margin:0">${esc(me.display_name || me.username || '')} · ${t('r_' + me.role)}</p>
        <div class="hub-grid">${DM.screensFor(me.role).map((s) => `<a class="hub-a" href="${DM.link(s, r)}"><div class="ic">${DM.SCREEN_ICON[s]}</div>
          <div><b>${esc(DM.screenTitle(s))}</b><span>${esc(SUB[s])}</span></div></a>`).join('')}</div>
        ${DMStore.mode === 'demo' ? `<button class="btn big block" id="demo-cust" style="margin-top:16px">📱 ${t('demoCustomer')}</button>
          <p class="muted" style="margin-top:12px;font-size:14px">Demo tip: open Kitchen and Counter in other tabs, then order as a customer — it appears instantly. Mark the bill paid at the Counter and the customer menu closes.</p>`
          : `<button class="btn block" data-signout style="margin-top:16px">⇄ ${t('switchUser')}</button>`}`;
      const dc = document.getElementById('demo-cust');
      if (dc) dc.onclick = async () => { const s = await DMStore.openTable(r.id, 1); window.open('menu.html?s=' + s.token, '_blank'); };
    }
    const $hub = document.getElementById('hub');
    document.addEventListener('dm:lang', render);
    render();
  })();
  </script>
</body>
</html>
