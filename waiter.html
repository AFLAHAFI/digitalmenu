<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>Waiter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icon.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body class="waiter">
  <div class="sticky-head"><div id="tp"></div><div class="tabs" id="tabs"></div><div id="obx"></div></div>
  <div id="pane-order">
    <div id="tables"></div>
    <div id="ordering" class="hidden">
      <div class="w-table-bar"><span id="w-table"></span>
        <div class="acts"><button class="btn primary" id="qr-btn"></button><button class="btn" id="chg"></button></div></div>
      <div id="menu"></div>
    </div>
  </div>
  <div id="pane-ready" class="hidden"></div>
  <div id="qr"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/outbox.js"></script>
  <script src="js/menu-ui.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script>
  (async function () {
    const { t, esc, money } = DM;
    const { r, me } = await DM.requireStaff('waiter');
    DM.demoBanner();
    document.title = t('waiter') + ' · ' + r.name;
    const $ = (id) => document.getElementById(id);
    const base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');

    let tab = 'order', table = null, items = [], orders = [], sessions = [], readySeen = null, qrTable = null, qrToken = null, queued = 0;
    let feed = null;
    const menus = {};   // one cart per table, so the waiter can switch tables

    const readyList = () => orders.filter((o) => o.status === 'ready').sort((a, b) => (a.ready_at || '').localeCompare(b.ready_at || ''));
    const isOpen = (n) => sessions.some((s) => s.table_no === n);

    // orders survive a network drop: kept on the phone, sent when back online
    const outbox = DM.Outbox('w_' + r.slug, (job) => DMStore.waiterOrder({ rid: r.id, table: job.table, items: job.items, note: job.note, clientRef: job.clientRef }), {
      onSent: () => { DM.toast(t('queuedSent'), 'good'); feed && feed.resync(); },
      onFailed: (job, e) => DM.toast(t('table') + ' ' + job.table + ': ' + DM.errMsg(e), 'bad'),
      onChange: (n) => { queued = n; $('obx').innerHTML = n ? `<div class="outbox-bar">⏳ ${t('queuedN', { n })}</div>` : ''; },
    });

    function renderHeader() { $('tp').innerHTML = DM.staffHeader(r, me, 'waiter'); }
    function renderTabs() {
      const n = readyList().length;
      $('tabs').innerHTML = `<button class="tab ${tab === 'order' ? 'on' : ''}" data-tab="order">${t('takeOrder')}</button>
        <button class="tab ${tab === 'ready' ? 'on' : ''}" data-tab="ready">${t('readyServe')}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
    }
    function renderTables() {
      const bill = new Map();
      orders.filter((o) => !o.paid_at && o.status !== 'cancelled').forEach((o) => bill.set(o.table_no, (bill.get(o.table_no) || 0) + Number(o.total)));
      $('tables').innerHTML = `<p class="center muted" style="margin:16px 0 0">${t('chooseTable')}</p>
        <div class="table-picker">${Array.from({ length: r.tables_count }, (_, i) => {
          const n = i + 1, amt = bill.get(n);
          return `<button class="tbtn ${amt ? 'busy' : ''} ${isOpen(n) ? 'open' : ''}" data-t="${n}">${isOpen(n) ? '<span class="dot">📱</span>' : ''}${n}${amt ? `<small>${money(amt)}</small>` : ''}</button>`;
        }).join('')}</div>`;
    }
    function renderReady() {
      const list = readyList();
      $('pane-ready').innerHTML = list.length ? list.map((o) => `<div class="ready-card" data-id="${o.id}">
          <div><div class="rt">${t('table')} ${o.table_no}</div><div class="muted">#${o.order_no} · ${DM.ago(o.ready_at || o.created_at)}</div>
            <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(DM.itemName(i))}</li>`).join('')}</ul></div>
          <button class="btn primary big" data-served>${t('markServed')}</button></div>`).join('')
        : `<p class="center muted pad">${t('nothingReady')}</p>`;
    }
    function showPane() {
      $('pane-order').classList.toggle('hidden', tab !== 'order');
      $('pane-ready').classList.toggle('hidden', tab !== 'ready');
      $('tables').classList.toggle('hidden', table !== null);
      $('ordering').classList.toggle('hidden', table === null);
      if (table !== null) {
        $('w-table').textContent = `${t('table')} ${table}`;
        $('qr-btn').textContent = '📱 ' + t('showQr');
        $('chg').textContent = t('changeTable');
        Object.entries(menus).forEach(([n, m]) => m.el.classList.toggle('hidden', Number(n) !== table));
      }
    }
    function render() { renderTabs(); renderTables(); renderReady(); showPane(); if (qrTable) drawQr(); }

    // ---- the QR customers scan (one per table, until the bill is paid) ----
    async function openQr(n) {
      const btn = $('qr-btn'); btn.disabled = true;
      try {
        const s = await DMStore.openTable(r.id, n);
        qrTable = n; qrToken = s.token; drawQr();
        if (!isOpen(n)) sessions = [...sessions, { id: s.token, table_no: n }];
      } catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
      btn.disabled = false;
    }
    function drawQr() {
      const url = base + 'menu.html?s=' + qrToken;
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      $('qr').innerHTML = `<div class="qr-modal">
          <div class="qt">${t('table')} ${qrTable}</div>
          <div style="opacity:.7">${t('qrFor')}</div>
          ${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}
          <div class="acts">
            <button class="btn primary big" data-qr-close>✓ ${t('ok')}</button>
            <button class="btn danger" data-close-table>${t('closeTable')}</button>
          </div>
          ${DMStore.mode === 'demo' ? `<a href="${esc(url)}" target="_blank" style="margin-top:14px;font-size:13px">demo: open as customer ↗</a>` : ''}
        </div>`;
      DM.keepAwake();
    }

    function openTable(n) {
      table = n;
      if (!menus[n]) {
        const el = document.createElement('div');
        $('menu').appendChild(el);
        const ui = DM.MenuUI(el, {
          cartKey: 'dm_wcart_' + r.slug + '_' + n, compact: true,
          sheetTitle: () => `${t('orderFor')} ${n}`,
          onSend: async (lines, note) => {
            let res;
            try { res = await outbox.send({ table: n, items: lines, note }); }
            catch (e) {
              if (String(e.message).startsWith('OUT_OF_STOCK')) feed.resync();
              throw e;
            }
            DM.toast(res && res.queued ? t('queued') : t('waiterSent', { t: n }), res && res.queued ? 'warn' : 'good');
            table = null; render(); window.scrollTo({ top: 0 });
            return true;
          },
        });
        menus[n] = { el, ui };
        ui.setItems(items.filter(Boolean), r.category_photos);
      }
      showPane(); window.scrollTo({ top: 0 });
    }

    async function loadItems() { items = await DMStore.listItems(r.id); Object.values(menus).forEach((m) => m.ui.setItems(items, r.category_photos)); }
    async function loadSessions() {
      sessions = await DMStore.listOpenSessions(r.id);
      if (qrTable && !isOpen(qrTable)) { qrTable = null; $('qr').innerHTML = ''; }   // paid/closed -> hide QR
      if (table === null) renderTables();
    }

    feed = DM.orderFeed(r.id, {
      items: true, sessions: true, onItems: loadItems, onSessions: loadSessions,
      onOrders(list) {
        orders = list;
        const ids = readyList().map((o) => o.id);
        if (readySeen && ids.some((id) => !readySeen.has(id))) DM.beep(2, 990);
        readySeen = new Set(ids);
        // don't redraw the table grid under the waiter's finger mid-order
        renderTabs(); renderReady(); if (table === null) renderTables(); showPane();
      },
    });

    document.body.addEventListener('click', async (e) => {
      DM.unlockAudio();
      const tb = e.target.closest('[data-tab]');
      if (tb) { tab = tb.dataset.tab; render(); return; }
      const tt = e.target.closest('#tables [data-t]');
      if (tt) { openTable(Number(tt.dataset.t)); return; }
      if (e.target.closest('#chg')) { table = null; render(); return; }
      if (e.target.closest('#qr-btn')) { openQr(table); return; }
      if (e.target.closest('[data-qr-close]')) { qrTable = null; $('qr').innerHTML = ''; return; }
      if (e.target.closest('[data-close-table]')) {
        if (!confirm(t('closeTableQ', { t: qrTable }))) return;
        const n = qrTable;
        try { await DMStore.closeTable(r.id, n); DM.toast('✓ ' + t('closeTable') + ' ' + n, 'good'); }
        catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
        qrTable = null; $('qr').innerHTML = ''; loadSessions();
        return;
      }
      const sv = e.target.closest('[data-served]');
      if (sv) {
        const id = sv.closest('[data-id]').dataset.id;
        sv.disabled = true;
        feed.patch(id, { status: 'served' });
        try { await DMStore.setOrderStatus(id, 'served'); }
        catch (err) { feed.patch(id, { status: 'ready' }); DM.toast(DM.errMsg(err), 'bad'); }
      }
    });
    document.addEventListener('dm:lang', () => { renderHeader(); render(); });
    renderHeader(); render();
  })();
  </script>
</body>
</html>
