<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>Owner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icon.svg">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="sticky-head no-print"><div id="tp"></div><div class="tabs" id="tabs"></div></div>
  <div class="wrap" id="pane"></div>
  <div id="modal"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script>
  (async function () {
    const { t, esc, money } = DM;
    let r = await DM.requireStaff();
    DM.demoBanner();
    document.title = t('owner') + ' · ' + r.name;
    const $ = (id) => document.getElementById(id);
    let tab = 'menu', items = [], editing = null;
    const base = location.href.replace(/[^/]*$/, '');      // folder of this page
    const link = (page, extra = '') => `${base}${page}?r=${encodeURIComponent(r.slug)}${extra}`;

    function renderTabs() {
      $('tp').innerHTML = DM.staffHeader(r, '⚙️ ' + t('owner'));
      $('tabs').innerHTML = [['menu', t('menuItems')], ['qr', t('tablesQr')], ['settings', t('settings')]]
        .map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('');
    }

    // ---------------- Menu items ----------------
    function renderMenu() {
      const cats = [...new Set(items.map((i) => i.category))];
      $('pane').innerHTML = `<button class="btn primary big block" data-new>${t('addItem')}</button>` +
        cats.map((c) => `<h2 class="sec">${esc(c)}</h2>` + items.filter((i) => i.category === c).map((i) => `
          <div class="adm-item ${i.in_stock ? '' : 'is-out'}" data-id="${i.id}">
            <div class="adm-thumb">${i.photo_url ? `<img src="${esc(i.photo_url)}" alt="">` : esc((i.name_ml || i.name_en).slice(0, 1))}</div>
            <div><div class="adm-name">${DM.vegMark(i.is_veg)}${esc(i.name_ml || i.name_en)}</div><div>${esc(i.name_en)}</div></div>
            <div class="price-cell"><input class="price-in" type="number" inputmode="decimal" min="0" step="1" value="${Number(i.price)}" aria-label="price">
              <button class="link-btn" data-edit>✎ ${t('edit')}</button></div>
            <div class="sw-cell"><label class="switch"><input type="checkbox" data-stock ${i.in_stock ? 'checked' : ''}><span></span></label>
              ${i.in_stock ? t('inStock') : t('out')}</div>
          </div>`).join('')).join('');
    }

    function openForm(item) {
      editing = item ? { ...item } : { name_en: '', name_ml: '', category: items[0] ? items[0].category : 'Main', price: '', is_veg: true, photo_url: null, sort: 0 };
      const cats = [...new Set(items.map((i) => i.category))];
      const e = editing;
      $('modal').innerHTML = `<div class="backdrop" data-close></div>
        <form class="sheet" id="item-form">
          <div class="sheet-h"><h3>${item ? t('editItem') : t('addItem')}</h3><button type="button" class="x" data-close>✕</button></div>
          <div class="form-grid">
            <label>${t('nameMl')}<input name="name_ml" value="${esc(e.name_ml)}" maxlength="80"></label>
            <label>${t('nameEn')} *<input name="name_en" value="${esc(e.name_en)}" maxlength="80" required></label>
            <div class="two">
              <label>${t('price')} *<input name="price" type="number" inputmode="decimal" min="0" step="0.5" value="${e.price}" required></label>
              <label>${t('category')}<input name="category" list="cats" value="${esc(e.category)}" maxlength="40" required>
                <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></label>
            </div>
            <div><div class="muted" style="font-size:14px;margin-bottom:4px">${t('type')}</div>
              <div class="seg"><label><input type="radio" name="veg" value="1" ${e.is_veg ? 'checked' : ''}>${DM.vegMark(true)} ${t('veg')}</label>
                <label><input type="radio" name="veg" value="0" ${!e.is_veg ? 'checked' : ''}>${DM.vegMark(false)} ${t('nonveg')}</label></div></div>
            <label>${t('photo')}<input type="file" accept="image/*" id="photo-in"></label>
            <div id="photo-box">${e.photo_url ? `<img class="photo-prev" src="${esc(e.photo_url)}"><button type="button" class="link-btn" data-rmphoto>${t('removePhoto')}</button>` : ''}</div>
            <label>${t('sortOrder')}<input name="sort" type="number" value="${e.sort || 0}"></label>
            <button class="btn primary big block" type="submit">${t('save')}</button>
            ${item ? `<button type="button" class="btn danger block" data-del>${t('del')}</button>` : ''}
          </div>
        </form>`;
      document.body.classList.add('noscroll');
      $('photo-in').onchange = async (ev) => {
        const f = ev.target.files[0]; if (!f) return;
        try {
          const blob = await shrink(f, DMStore.mode === 'demo' ? 360 : 720);
          editing._blob = blob;
          $('photo-box').innerHTML = `<img class="photo-prev" src="${URL.createObjectURL(blob)}">`;
        } catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
      };
      $('item-form').onsubmit = async (ev) => {
        ev.preventDefault();
        const f = ev.target; const btn = f.querySelector('[type=submit]'); btn.disabled = true;
        try {
          let photo_url = editing.photo_url;
          if (editing._blob) photo_url = await DMStore.uploadPhoto(r.id, editing._blob);
          const row = {
            name_en: f.name_en.value.trim(), name_ml: f.name_ml.value.trim() || null,
            price: Number(f.price.value), category: f.category.value.trim() || 'Main',
            is_veg: f.veg.value === '1', photo_url, sort: Number(f.sort.value) || 0,
          };
          if (editing.id) row.id = editing.id;
          await DMStore.saveItem(r.id, row);
          closeForm(); DM.toast(t('saved'), 'good'); await loadItems();
        } catch (err) { btn.disabled = false; DM.toast(DM.errMsg(err), 'bad'); }
      };
    }
    function closeForm() { editing = null; $('modal').innerHTML = ''; document.body.classList.remove('noscroll'); }

    // resize a phone photo (often 4–8 MB) to a small JPEG before upload
    function shrink(file, max) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          c.toBlob((b) => (b ? res(b) : rej(new Error('photo error'))), 'image/jpeg', 0.8);
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => rej(new Error('Could not read photo'));
        img.src = URL.createObjectURL(file);
      });
    }

    // ---------------- Tables & QR ----------------
    function renderQR() {
      $('pane').innerHTML = `<div class="card">
          <form id="tables-form" class="two" style="align-items:end">
            <label>${t('tablesCount')}<input name="n" type="number" min="1" max="200" value="${r.tables_count}" required></label>
            <button class="btn primary" type="submit">${t('save')}</button>
          </form>
          <p class="muted" style="margin-bottom:0">📱 ${t('tablesInfo')}</p>
        </div>`;
      $('tables-form').onsubmit = async (ev) => {
        ev.preventDefault();
        try { r = await DMStore.updateRestaurant(r.id, { tables_count: Number(ev.target.n.value) }); DM.toast(t('saved'), 'good'); renderQR(); }
        catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
      };
    }

    // ---------------- Settings ----------------
    function renderSettings() {
      const screens = [['🍳 ' + t('kitchen'), 'kitchen.html'], ['🧾 ' + t('counter'), 'counter.html'],
        ['🧑‍🍳 ' + t('waiter'), 'waiter.html']];
      $('pane').innerHTML = `<form class="card form-grid" id="set-form">
          <label>${t('hotelName')}<input name="name" value="${esc(r.name)}" required maxlength="80"></label>
          <label>${t('hotelNameMl')}<input name="name_ml" value="${esc(r.name_ml || '')}" maxlength="80"></label>
          <label>${t('upiId')}<input name="upi_id" value="${esc(r.upi_id || '')}" placeholder="name@okbank" maxlength="80"></label>
          <button class="btn primary big" type="submit">${t('save')}</button>
        </form>
        <div class="card links-list"><h3>${t('links')}</h3>
          ${screens.map(([l, p, x]) => `<a href="${esc(link(p, x || ''))}" target="_blank">${l}<br><small class="muted">${esc(link(p, x || ''))}</small></a>`).join('')}
        </div>
        ${DMStore.mode === 'demo' ? `<div class="card"><button class="btn danger block" id="reset">Reset demo data</button></div>` : ''}`;
      $('set-form').onsubmit = async (ev) => {
        ev.preventDefault(); const f = ev.target;
        try {
          r = await DMStore.updateRestaurant(r.id, { name: f.name.value.trim(), name_ml: f.name_ml.value.trim() || null, upi_id: f.upi_id.value.trim() || null });
          DM.toast(t('saved'), 'good'); renderTabs();
        } catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
      };
      const rs = $('reset');
      if (rs) rs.onclick = () => { if (confirm('Reset all demo data?')) { DMStore.reset(); location.reload(); } };
    }

    function render() {
      renderTabs();
      if (tab === 'menu') renderMenu(); else if (tab === 'qr') renderQR(); else renderSettings();
    }
    async function loadItems() {
      items = await DMStore.listItems(r.id);
      // don't redraw while the owner is typing a price
      if (tab === 'menu' && !(document.activeElement && document.activeElement.classList.contains('price-in'))) renderMenu();
    }

    // ---------------- events ----------------
    document.body.addEventListener('click', async (e) => {
      const tb = e.target.closest('[data-tab]');
      if (tb) { tab = tb.dataset.tab; render(); return; }
      if (e.target.closest('[data-new]')) { openForm(null); return; }
      if (e.target.closest('[data-edit]')) { openForm(items.find((i) => i.id === e.target.closest('[data-id]').dataset.id)); return; }
      if (e.target.closest('[data-close]')) { closeForm(); return; }
      if (e.target.closest('[data-rmphoto]')) { editing.photo_url = null; delete editing._blob; $('photo-box').innerHTML = ''; return; }
      if (e.target.closest('[data-del]')) {
        if (!confirm(t('delQ'))) return;
        try { await DMStore.deleteItem(editing.id); closeForm(); await loadItems(); } catch (err) { DM.toast(DM.errMsg(err), 'bad'); }
      }
    });
    $('pane').addEventListener('change', async (e) => {
      const row = e.target.closest('[data-id]'); if (!row) return;
      const id = row.dataset.id;
      try {
        if (e.target.matches('[data-stock]')) {
          await DMStore.saveItem(r.id, { id, in_stock: e.target.checked });
          DM.toast(t('saved'), 'good');
        } else if (e.target.matches('.price-in')) {
          const v = Number(e.target.value);
          if (!(v >= 0) || e.target.value === '') throw new Error('Invalid price');
          await DMStore.saveItem(r.id, { id, price: v });
          DM.toast(t('saved') + ' · ' + money(v), 'good');
          e.target.blur();
        }
        await loadItems();
      } catch (err) { DM.toast(DM.errMsg(err), 'bad'); await loadItems(); }
    });
    $('pane').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.price-in')) e.target.blur(); });
    document.addEventListener('dm:lang', () => { render(); if (editing) openForm(editing.id ? editing : null); });

    render();
    DM.live(r.id, { orders: false, items: true }, loadItems, 60000);
  })();
  </script>
</body>
</html>
