<!doctype html>
<html lang="ml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/icon.svg">
</head>
<body>
  <div id="obx"></div>
  <div id="head"></div>
  <div id="menu"></div>
  <div id="done" class="hidden"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/outbox.js"></script>
  <script src="js/menu-ui.js"></script>
  <script>
  // Customer menu. Opens ONLY with the token from the QR the waiter shows
  // (?s=...). When the bill is paid the token closes and so does this page.
  (async function () {
    const { t, esc, money } = DM;
    const $head = document.getElementById('head');
    const $menu = document.getElementById('menu');
    const $done = document.getElementById('done');
    const $obx = document.getElementById('obx');
    const token = DM.param('s');
    DM.demoBanner();

    const CACHE = 'dm_menu_' + token;
    let info = null;          // { restaurant, menu_version, table_no, items }
    let orders = [];
    let view = 'menu', lastRes = null, closedNow = false, menu = null, outbox = null;

    function lockScreen(kind) {
      closedNow = true;
      const [title, sub, icon] = kind === 'closed' ? [t('closedTitle'), t('closedSub'), '🙏'] : [t('lockedTitle'), t('lockedSub'), '🔒'];
      $head.innerHTML = ''; $obx.innerHTML = '';
      $done.classList.add('hidden'); $menu.classList.remove('hidden');
      $menu.innerHTML = `<div class="lock"><div class="lock-ic">${icon}</div>
          <h2>${esc(title)}</h2><p class="muted">${esc(sub)}</p>
          <div style="margin-top:18px">${DM.langToggleHTML()}</div></div>`;
      document.body.classList.remove('noscroll');
      try {
        localStorage.removeItem(CACHE); localStorage.removeItem('dm_outbox_c_' + token);
        Object.keys(sessionStorage).filter((k) => k.startsWith('dm_cart_')).forEach((k) => sessionStorage.removeItem(k));
      } catch (e) { /* ignore */ }
      document.addEventListener('dm:lang', () => lockScreen(kind), { once: true });
    }
    const isClosedErr = (e) => String(e && e.message).includes('SESSION_CLOSED');

    if (!token) { lockScreen('locked'); return; }

    function renderHead() {
      if (closedNow || !info) return;
      const r = info.restaurant;
      const name = DM.lang === 'ml' && r.name_ml ? r.name_ml : r.name;
      const sub = DM.lang === 'ml' && r.name_ml ? r.name : (r.name_ml || '');
      $head.innerHTML = `<div class="cust-head ${r.banner_url ? 'has-banner' : ''}" ${r.banner_url ? `style="background-image:url('${esc(r.banner_url)}')"` : ''}>
          <div class="row"><div class="brand">${r.logo_url ? `<img class="c-logo" src="${esc(r.logo_url)}" alt="">` : ''}
            <div><h1>${esc(name)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>
          ${DM.langToggleHTML()}</div>
          <span class="table-pill">${t('table')} ${info.table_no}</span>
          ${orders.length && view === 'menu' ? `<button class="my-orders-btn" id="show-mine">${t('myShort')} (${orders.length}) ›</button>` : ''}
        </div>`;
      const b = document.getElementById('show-mine');
      if (b) b.onclick = () => showDone(null);
    }

    function showDone(res) {
      view = 'done'; lastRes = res;
      $menu.classList.add('hidden'); $done.classList.remove('hidden');
      window.scrollTo({ top: 0 });
      renderDone(); renderHead();
    }
    function renderDone() {
      if (closedNow) return;
      const res = lastRes;
      const waiting = res && res.queued;
      $done.innerHTML = `<div class="done">
        ${res ? `<div class="tick ${waiting ? 'wait' : ''}">${waiting ? '⏳' : '✓'}</div>
          <h2>${waiting ? t('queued') : t('sent')}</h2>${waiting ? '' : `<p class="muted">${t('sentSub')}</p>
          <p><b>${t('orderNo')} #${res.order_no}</b> · ${money(res.total)}</p>`}` : ''}
        <div class="my-orders"><h3>${t('tableOrders')}</h3>
          ${orders.map((o) => `<div class="mo">
              <div><b>#${o.order_no}</b> <span class="muted">· ${DM.clock(o.created_at)} · ${money(o.total)}</span></div>
              <span class="status s-${o.status}">${t('st_' + o.status)}</span></div>`).join('') || '<p class="muted">—</p>'}
        </div>
        <button class="btn primary big block" id="more">${t('orderMore')}</button>
      </div>`;
      document.getElementById('more').onclick = () => {
        view = 'menu'; $done.classList.add('hidden'); $menu.classList.remove('hidden'); renderHead(); window.scrollTo({ top: 0 });
      };
    }

    function applyMenu(m) {
      info = m;
      document.title = m.restaurant.name;
      DM.applyBrand(m.restaurant.theme_color);
      if (!menu) {
        $menu.innerHTML = '';
        menu = DM.MenuUI($menu, {
          cartKey: 'dm_cart_' + token,
          onSend: async (lines, note) => {
            try {
              const res = await outbox.send({ items: lines, note });
              if (!res.queued) await refresh(true);
              showDone(res);
              return true;
            } catch (e) {
              if (isClosedErr(e)) { lockScreen('closed'); return false; }
              if (String(e.message).startsWith('OUT_OF_STOCK')) refresh(true, true);
              throw e;
            }
          },
        });
      }
      menu.setItems(m.items, m.restaurant.category_photos || {});
      renderHead();
    }

    // cheap poll: is the table open? did the menu change? order statuses
    let refreshing = false;
    async function refresh(force, menuToo) {
      if (closedNow || (refreshing && !force)) return;
      refreshing = true;
      try {
        const st = await DMStore.sessionState(token);
        DM.setConn(true);
        if (!st.open) { lockScreen('closed'); return; }
        orders = st.orders || [];
        if (!info || menuToo || st.menu_version !== info.menu_version) {
          const m = await DMStore.sessionMenu(token);
          try { localStorage.setItem(CACHE, JSON.stringify(m)); } catch (e) { /* full: skip cache */ }
          applyMenu(m);
        } else renderHead();
        if (view === 'done') renderDone();
      } catch (e) {
        if (isClosedErr(e)) { lockScreen('closed'); return; }
        console.warn(e);
        if (!info) $menu.innerHTML = `<div class="center-msg">${t('offline')}</div>`;
        if (DM.isNetErr(e)) DM.setConn(false);
      } finally { refreshing = false; }
    }

    outbox = DM.Outbox('c_' + token, (job) => DMStore.placeOrder({ token, items: job.items, note: job.note, clientRef: job.clientRef }), {
      onSent: () => { DM.toast(t('queuedSent'), 'good'); refresh(true); },
      onFailed: (job, e) => { if (isClosedErr(e)) lockScreen('closed'); else DM.toast(DM.errMsg(e), 'bad'); },
      onChange: (n) => { if (!closedNow) $obx.innerHTML = n ? `<div class="outbox-bar">⏳ ${t('queuedN', { n })}</div>` : ''; },
    });

    // show the saved menu instantly, then check with the server
    try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c && c.items) applyMenu(c); } catch (e) { /* ignore */ }
    document.addEventListener('dm:lang', () => { if (closedNow) return; renderHead(); if (view === 'done') renderDone(); });
    await refresh(true);
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 8000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
    window.addEventListener('online', () => refresh(true));
    if (DMStore.onChange) DMStore.onChange(() => refresh());   // demo: instant across tabs
  })();
  </script>
</body>
</html>
